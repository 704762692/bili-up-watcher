name: Bilibili UP 动态监控

# 每 5 分钟跑一次(注意:GitHub Actions 的 cron 用的是 UTC 时间)
# 想更频繁可改成 */2 * * * *(每2分钟);但建议不低于2分钟,避免误伤接口风控
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: # 允许你在 Actions 页面手动点"Run workflow"测试

permissions:
  contents: write # 需要写回 data/state.json 记录"已看过哪些动态"

concurrency:
  group: bili-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 运行监控脚本
        env:
          # UID / 名字:推荐配成"仓库变量"(Settings → Secrets and variables → Actions → Variables)
          UP_UID: ${{ vars.UP_UID }}
          UP_NAME: ${{ vars.UP_NAME }}
          # 推送密钥:务必配成"仓库密钥 Secrets",内容不会进代码库、日志也会打码
          BARK_KEY: ${{ secrets.BARK_KEY }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
        run: python monitor.py

      - name: 保存监控状态
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          git diff --cached --quiet || git commit -m "update watch state"
          git push
